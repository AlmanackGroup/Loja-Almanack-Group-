<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almanack Group - Em Breve</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #03060d;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid #0066ff;
            box-shadow: 0 0 10px #0066ff;
            z-index: 2;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        .logo-central {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0px 0px 15px #0066ff) drop-shadow(0px 0px 30px rgba(0, 102, 255, 0.6));
        }

        .titulo-em-breve {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 102, 255, 0.5);
        }

        .titulo-em-breve span {
            color: #0066ff;
            text-shadow: 0 0 15px #0066ff, 0 0 30px #0066ff;
        }

        /* Estilo do Contador Regressivo */
        .countdown-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .countdown-box {
            background-color: rgba(0, 102, 255, 0.08);
            border: 1px solid rgba(0, 102, 255, 0.4);
            border-radius: 6px;
            padding: 10px 15px;
            min-width: 70px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.2);
        }

        .countdown-number {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #0066ff;
        }

        .countdown-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .status-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .status-tag .dot {
            width: 7px;
            height: 7px;
            background-color: #0066ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff;
        }

        .descricao {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .slogan {
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #0066ff;
            text-shadow: 0 0 10px #0066ff;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .acompanhe-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border: 1px solid rgba(0, 102, 255, 0.4);
            background-color: rgba(0, 102, 255, 0.05);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #0066ff;
            background-color: rgba(0, 102, 255, 0.25);
            color: #0066ff;
            box-shadow: 0 0 15px #0066ff;
            transform: translateY(-3px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer-menu {
            display: flex;
            gap: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 20px;
            z-index: 2;
        }

        .footer-menu span {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-menu .diamond {
            color: #0066ff;
            font-size: 8px;
            text-shadow: 0 0 8px #0066ff;
        }

        .domain {
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 25px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="main-container">
        <img src="imagemcarregamento.jpg" alt="Almanack Group" class="logo-central">

        <h1 class="titulo-em-breve">EM <span>BREVE</span></h1>

        <div class="countdown-container">
            <div class="countdown-box">
                <div id="hours" class="countdown-number">12</div>
                <div class="countdown-label">Horas</div>
            </div>
            <div class="countdown-box">
                <div id="minutes" class="countdown-number">00</div>
                <div class="countdown-label">Minutos</div>
            </div>
            <div class="countdown-box">
                <div id="seconds" class="countdown-number">00</div>
                <div class="countdown-label">Segundos</div>
            </div>
        </div>

        <div class="status-tag">
            <span class="dot"></span> LOJA EM MANUTENÇÃO & MELHORIAS
        </div>

        <p class="descricao">A nova loja de VIPs da Almanack Group está chegando.</p>
        <div class="slogan">BE THE ONE.</div>

        <div class="acompanhe-text">ACOMPANHE</div>

        <div class="social-buttons">
            <a href="https://x.com" target="_blank" class="social-btn" title="Twitter / X">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            <a href="https://twitch.tv" target="_blank" class="social-btn" title="Twitch">
                <svg viewBox="0 0 24 24"><path d="M11.571 1.429L1.429 4.286v14.286h4.286v4.286l4.286-4.286h3.571L21.429 10.714V1.429zm8.571 8.571l-2.857 2.857h-3.571l-2.857 2.857v-2.857H7.857V2.857h12.286zM15 6.429h2.143v5.714H15zm-5 0h2.143v5.714H10z"/></svg>
            </a>
            <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            </a>
        </div>
    </div>

    <div class="footer-menu">
        <span>VIPS <span class="diamond">◆</span></span>
        <span>BENEFÍCIOS <span class="diamond">◆</span></span>
        <span>SUPORTE <span class="diamond">◆</span></span>
        <span>REGRAS</span>
    </div>

    <div class="domain">ALMANACKGROUP.COM</div>

    <script>
        // Lógica do Contador de 12 Horas
        let totalSeconds = 12 * 60 * 60;

        function updateCountdown() {
            if (totalSeconds <= 0) {
                totalSeconds = 12 * 60 * 60; // Reinicia se zerar
            }

            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            document.getElementById('hours').textContent = String(h).padStart(2, '0');
            document.getElementById('minutes').textContent = String(m).padStart(2, '0');
            document.getElementById('seconds').textContent = String(s).padStart(2, '0');

            totalSeconds--;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Lógica das Partículas Quadradas Neon
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const squareParticles = [];
        const numParticles = 60;

        class SquareParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 3;
                this.speedY = -(Math.random() * 0.8 + 0.3);
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(0, 102, 255, ${this.opacity})`;
                ctx.shadowColor = '#0066ff';
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function init() {
            for (let i = 0; i < numParticles; i++) {
                squareParticles.push(new SquareParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < squareParticles.length; i++) {
                squareParticles[i].update();
                squareParticles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
